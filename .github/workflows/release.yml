name: Release server bundles

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version without v prefix
        required: true

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: go test ./...
        working-directory: server
      - run: npm test
      - name: Verify native desktop builds
        run: |
          cd server
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -o "$RUNNER_TEMP/usagewidgetd-darwin-amd64" ./cmd/usagewidgetd
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -o "$RUNNER_TEMP/usagewidgetd-darwin-arm64" ./cmd/usagewidgetd
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -o "$RUNNER_TEMP/usagewidgetd-windows-amd64.exe" ./cmd/usagewidgetd
          CGO_ENABLED=0 GOOS=windows GOARCH=arm64 go build -o "$RUNNER_TEMP/usagewidgetd-windows-arm64.exe" ./cmd/usagewidgetd
      - run: bash -n server-install.sh server-setup.sh scripts/package-release.sh scripts/package-desktop-release.sh cli/usagewidget server/deploy/redeploy.sh server/deploy/start-macos.sh server/deploy/install-macos.sh
      - run: |
          tests/installer_test.sh
          bash tests/cli_test.sh

  windows-smoke:
    uses: ./.github/workflows/windows-smoke.yml

  bundle:
    needs: [test, windows-smoke]
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: darwin
            arch: amd64
          - os: darwin
            arch: arm64
          - os: windows
            arch: amd64
          - os: windows
            arch: arm64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - name: Resolve version
        id: version
        shell: bash
        run: |
          value="${{ inputs.version }}"
          if [[ -z "$value" ]]; then value="${GITHUB_REF_NAME#v}"; fi
          echo "value=$value" >> "$GITHUB_OUTPUT"
      - run: sudo apt-get update && sudo apt-get install -y jq zip
      - name: Package server
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == linux ]]; then
            scripts/package-release.sh "${{ steps.version.outputs.value }}" "${{ matrix.arch }}"
          else
            scripts/package-desktop-release.sh "${{ steps.version.outputs.value }}" "${{ matrix.os }}" "${{ matrix.arch }}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: usagewidget-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
