# Native Windows daemon smoke: parse installers, build usagewidgetd, and
# collect through POST /v1/poll. Needs no secrets and publishes nothing.

name: Windows smoke

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-smoke:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Parse hosted Windows installer
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "install.ps1"
          node -e "import('./worker/install.js').then(async ({default:w}) => process.stdout.write(await (await w.fetch(new Request('https://usagewidget.edmundlim.systems/install.ps1'))).text()))" |
            Set-Content -LiteralPath $installer -Encoding UTF8
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            $installer,
            [ref]$tokens,
            [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -ne 0) { throw ($parseErrors | Out-String) }
      - name: Parse launcher and build native daemon
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD\deploy\start-windows.ps1",
            [ref]$tokens,
            [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -ne 0) { throw ($parseErrors | Out-String) }
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD\deploy\install-windows.ps1",
            [ref]$tokens,
            [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -ne 0) { throw ($parseErrors | Out-String) }
          go build -o usagewidgetd.exe ./cmd/usagewidgetd
          go build -o usagewidget-qr.exe ./cmd/usagewidget-qr
        working-directory: server
      - name: Run Windows API and collection smoke test
        shell: pwsh
        working-directory: server
        run: |
          $mock = Start-Job {
            $listener = [System.Net.HttpListener]::new()
            $listener.Prefixes.Add("http://127.0.0.1:18765/")
            $listener.Start()
            while ($true) {
              $context = $listener.GetContext()
              $body = [Text.Encoding]::UTF8.GetBytes('{"schema":"crossusage.limits.v1","providers":{"codex":{"displayName":"Codex","resources":{"session":{"unit":"percent","used":5,"limit":100,"utilization":0.05,"label":"Session"}}}},"errors":[]}')
              $context.Response.ContentType = "application/json"
              $context.Response.ContentLength64 = $body.Length
              $context.Response.OutputStream.Write($body, 0, $body.Length)
              $context.Response.Close()
            }
          }
          $env:USAGEWIDGET_TOKEN = "0123456789abcdef0123456789abcdef"
          $env:CROSSUSAGE_URL = "http://127.0.0.1:18765/usage"
          $env:DB_PATH = "$env:RUNNER_TEMP\usagewidget-smoke.db"
          $env:LISTEN_ADDR = "127.0.0.1:18377"
          $daemon = Start-Process -FilePath ".\usagewidgetd.exe" -PassThru
          try {
            $headers = @{ Authorization = "Bearer $env:USAGEWIDGET_TOKEN" }
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              try {
                $health = Invoke-RestMethod -Headers $headers -Uri "http://127.0.0.1:18377/v1/health"
                break
              } catch { Start-Sleep -Milliseconds 200 }
            }
            if ($health.service -ne "ok") { throw "Windows health check failed" }
            if ($health.collector.source -ne "crossusage-http") {
              throw "Windows smoke selected collector source '$($health.collector.source)' instead of crossusage-http"
            }
            $lastPollError = $null
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              try {
                $poll = Invoke-RestMethod -Method Post -Headers $headers -Uri "http://127.0.0.1:18377/v1/poll"
                if ($poll.success) { break }
                $lastPollError = ($poll | ConvertTo-Json -Compress)
              } catch {
                $lastPollError = "$_"
              }
              Start-Sleep -Milliseconds 200
            }
            if (-not $poll.success) { throw "Windows collection failed: $lastPollError" }
            $snapshot = Invoke-RestMethod -Headers $headers -Uri "http://127.0.0.1:18377/v1/snapshot"
            if ($snapshot.providers[0].id -ne "codex") { throw "Windows snapshot normalization failed" }
          } finally {
            Stop-Process -Id $daemon.Id -Force -ErrorAction SilentlyContinue
            Stop-Job $mock -ErrorAction SilentlyContinue
            Remove-Job $mock -Force -ErrorAction SilentlyContinue
          }
